<!doctype html>
<html>
	<head>
		<title>kwigbelle</title>

		<!-- Browser Setup -->
		<meta charset="utf-8" />
		<meta name="description" content="kwigbelle" />
		<link rel="icon" href="./favicon/favicon.ico" />
		<link rel="apple-touch-icon" href="./favicon/apple-touch-icon.png" />
		<link rel="manifest" href="./manifest.json" />
		<meta
			name="viewport"
			content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
		/>

		<!-- Google Fonts: Inconsolata is the avastars.io typeface
		     (docs/tads/design-cues.md); every use falls back to the
		     generic monospace stack if this fails to load -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600;700&display=swap"
		/>

		<!-- Global Styles -->

		<style>
			body {
				box-sizing: border-box;
				padding: 0;
				margin: 0;
				display: block;
				color: #fff;
				/* avastars.io deep navy while nothing is loaded; the
				   loaded token's own background color replaces it on
				   #contentView at runtime (art area stays art-driven) */
				background-color: #150437;
				user-select: none;
				-webkit-user-select: none;
				-moz-user-select: none;
			}

			body.noScroll {
				/* ...or body.dialogShowing */
				overflow: hidden;
				position: fixed;
			}

			body,
			html {
				height: 100%;
				width: 100%;
				background: #150437;
				overflow: hidden;
				position: fixed;
			}

			canvas {
				width: 100%;
				height: 100%;
			}

			#contentView {
				position: absolute;
				left: 0px;
				top: 0px;
				width: 100%;
				height: 100%;
				background-color: #150437;
			}
		</style>
		<link rel="stylesheet" href="./style.css" />
		<script type="text/javascript" src="./Lib/vendor/web3.min.js"></script>
		<!-- Import map for the vendored 3D stack (docs/tads/vrm-viewer.md).
		     Must precede every module script, so it lives in head. -->
		<script type="importmap">
			{
				"imports": {
					"three": "./Lib/vendor/three/build/three.module.min.js"
				}
			}
		</script>
	</head>
	<body class="noScroll">
		<div id="contentView"></div>
		<script type="module">
			import MainScene from "./Lib/MainScene.js";
			// Setup the application initialization
			(function (window, document, undefined) {
				window.onload = function () {
					let contentView = document.getElementById("contentView");
					const currentScene = new MainScene(contentView);
				};
			})(window, document, undefined);
		</script>
	</body>
</html>
