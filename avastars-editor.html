<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<title>Avastars copy editor</title>
		<meta name="robots" content="noindex" />
		<style>
			:root {
				color-scheme: dark;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				padding: 16px 16px 96px;
				background: #0d0a1a;
				color: #e8e4f5;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			}
			h1 {
				font-size: 20px;
				margin: 4px 0 8px;
			}
			.editorIntro {
				color: #a89fc4;
				font-size: 14px;
				line-height: 1.45;
			}
			.editorDraftBanner {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				padding: 10px 12px;
				margin: 10px 0;
				border: 1px solid #4a3f73;
				border-radius: 10px;
				background: #1c1533;
				font-size: 13px;
			}
			.editorDraftBanner button {
				flex-shrink: 0;
			}
			.editorGroup {
				margin: 22px 0;
				padding: 14px;
				border: 1px solid #2c2350;
				border-radius: 14px;
				background: #131024;
			}
			.editorGroup h2 {
				font-size: 15px;
				margin: 0 0 4px;
				text-transform: uppercase;
				letter-spacing: 1px;
			}
			.editorGroupNote {
				color: #a89fc4;
				font-size: 13px;
				margin: 0 0 12px;
				line-height: 1.4;
			}
			.editorField {
				margin: 14px 0;
			}
			.editorDescription {
				display: block;
				font-size: 13px;
				color: #cfc8e6;
				margin-bottom: 6px;
				line-height: 1.35;
			}
			.editorInput {
				width: 100%;
				/* 16px stops iOS Safari from zooming the page on focus */
				font-size: 16px;
				font-family: inherit;
				line-height: 1.4;
				padding: 10px;
				border-radius: 10px;
				border: 1px solid #3a2f63;
				background: #0d0a1a;
				color: #e8e4f5;
				resize: vertical;
				min-height: 52px;
			}
			.hasError .editorInput {
				border-color: #d05555;
			}
			.editorError {
				color: #e88;
				font-size: 13px;
				margin-top: 4px;
				min-height: 0;
			}
			#editorBar {
				position: fixed;
				left: 0;
				right: 0;
				bottom: 0;
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
				background: #1c1533f0;
				backdrop-filter: blur(8px);
				border-top: 1px solid #2c2350;
			}
			#editorStatus {
				font-size: 14px;
				color: #a89fc4;
			}
			button {
				font-size: 15px;
				font-family: inherit;
				padding: 10px 18px;
				border-radius: 10px;
				border: none;
				background: #6d4fd8;
				color: #fff;
			}
			button:disabled {
				opacity: 0.45;
			}
		</style>
	</head>
	<body>
		<main id="editorRoot"></main>
		<script type="module">
			import { buildEditor } from "./Lib/StringsEditor.js";
			buildEditor(document.getElementById("editorRoot"));
		</script>
	</body>
</html>
